plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'io.izzel.taboolib' version '2.0.39'
}
group = 'ink.ptms.purtmarsarea'
version = '2.0.0+26.2'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
taboolib {
    env { install 'platform-bukkit' }
    version {
        taboolib = '6.3.0-0e3a911'
        skipPlatformFile = true
    }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25 } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.129-stable'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.129-stable'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { filesMatching('plugin.yml') { expand version: project.version } }
test { useJUnitPlatform(); jvmArgs '-XX:+EnableDynamicAgentLoading' }

tasks.register('dist', Copy) {
    dependsOn tasks.named('build'), tasks.named('taboolibMainTask')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('dist'))
    rename { 'PurtmarsArea.jar' }
}
