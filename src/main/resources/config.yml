Settings:
  EnableWorld: [world]
  MemberLimit: 100
  AreaLimit: 10
  MaxRadius: 128
  MaxSideLength: 256
  MemberInputTimeout: 60
  # 荒地中的禁止操作，领地核心仍可放置。
  ClaimWorld: {}
  IgnoreFlags: [teleport]
  Particle:
    Period: 2
    Distance: 1.5
    Range: 50
    # 每名玩家每轮粒子上限，超大领地也不会无限产生粒子。
    Budget: 500
  Flags:
    particle: true
    build: false
    move: true
    teleport: true
    container: false
    enchant-table: true
    anvil: true
    door: false
    cake: false
    item-drop: true
    item-pick: true
    damage-animals: false
    damage-monster: false
    spawn-animals: false
    spawn-monster: false
    redstone: false
    redstone-perform: true
    flow-lava: true
    flow-water: true
    villager-trade: true
    shear: false
    leash: false
    falling: false
    # 新增规则，阻止环境破坏领地及核心。
    explosion: false
    fire: false
    pvp: true
# dimensions 是实际方块边长；旧配置 size 始终保持半径语义。
Cores:
  '0':
    dimensions: {x: 8, y: 8, z: 8}
    material: WHITE_STAINED_GLASS
    name: '&e小型领地核心'
    lore: ['&7保护范围: 8×8×8', '&7放置后创建领地，右键管理', '&7核心保护范围之间不能重叠']
    shiny: true
    drop:
      material: GHAST_TEAR
      name: '&7破碎的小型领地核心'
      lore: ['&7修补后可继续使用']
  '1':
